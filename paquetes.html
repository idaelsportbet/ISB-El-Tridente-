<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISB | El Tridente - Paquetes</title>

  <style>
    :root{
      --bg:#030303;
      --panel:#090909;
      --panel2:#0d0d0d;
      --gold:#f6c34f;
      --gold2:#b98521;
      --gold3:#6e5017;
      --text:#fff;
      --muted:#c9c9c9;
      --green:#00aa56;
      --max:1180px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:#030303;
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
    }

    /* =========================
       BARRA SUPERIOR
    ========================= */

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(2,2,2,.98);
      border-bottom:1px solid #2a1e0c;
      backdrop-filter:blur(10px);
      overflow-x:auto;
      scrollbar-width:none;
    }

    .topbar::-webkit-scrollbar{
      display:none;
    }

    .topbar-inner{
      min-width:max-content;
      height:72px;
      padding:0 18px;
      display:flex;
      align-items:center;
      gap:26px;
      white-space:nowrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }

    .brand-icon{
      color:var(--gold);
      font-size:28px;
      line-height:1;
      filter:drop-shadow(0 0 5px rgba(246,195,79,.25));
    }

    .brand-text strong{
      display:block;
      color:var(--gold);
      font-family:Georgia,serif;
      font-size:22px;
      line-height:1;
    }

    .brand-text span{
      display:block;
      font-size:7px;
      letter-spacing:2.5px;
      margin-top:3px;
      font-weight:800;
    }

    .nav{
      display:flex;
      align-items:center;
      gap:24px;
      flex:0 0 auto;
    }

    .nav a{
      position:relative;
      padding:28px 0 22px;
      font-size:13px;
      color:#eee;
    }

    .nav a.active{
      color:var(--gold);
    }

    .nav a.active::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:2px;
      background:var(--gold);
    }

    .logout{
      margin-left:4px;
      border:1px solid var(--gold2);
      background:#050505;
      color:#fff;
      border-radius:16px;
      padding:10px 15px;
      font-weight:800;
      font-size:13px;
      flex:0 0 auto;
      cursor:pointer;
    }

    /* =========================
       HERO
    ========================= */

    .hero{
      position:relative;
      min-height:400px;
      overflow:hidden;
      border-bottom:1px solid #2b200e;
      background:#050505;
    }

    .hero-bg{
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.995) 0%,
          rgba(0,0,0,.98) 24%,
          rgba(0,0,0,.88) 42%,
          rgba(0,0,0,.58) 61%,
          rgba(0,0,0,.30) 82%,
          rgba(0,0,0,.20) 100%
        ),
        url("35F2F7B6-7B66-470B-82DE-4420BA7A57B5.jpeg") 88% 42% / cover no-repeat;
      filter:brightness(.80) contrast(1.04);
      transform:scale(1.01);
    }

    .hero-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 80% 35%,rgba(246,195,79,.10),transparent 24%),
        linear-gradient(180deg,transparent 62%,rgba(0,0,0,.74) 100%);
    }

    .hero-inner{
      position:relative;
      z-index:2;
      width:min(var(--max),calc(100% - 26px));
      margin:auto;
      min-height:400px;
      display:flex;
      align-items:center;
      padding:26px 0 24px;
    }

    .hero-copy{
      width:min(540px,58%);
    }

    .hero-logo{
      display:flex;
      align-items:center;
      gap:9px;
      margin-bottom:10px;
    }

    .hero-logo-icon{
      color:var(--gold);
      font-size:44px;
    }

    .hero-logo-text strong{
      display:block;
      color:var(--gold);
      font-family:Georgia,serif;
      font-size:40px;
      line-height:.9;
    }

    .hero-logo-text span{
      display:block;
      color:#f3d27b;
      font-family:Georgia,serif;
      font-size:18px;
      letter-spacing:2.5px;
      margin-top:4px;
    }

    .hero-mini{
      color:#dedede;
      font-size:10px;
      letter-spacing:2.5px;
      font-weight:700;
      margin:8px 0;
    }

    .hero h1{
      margin:0;
      text-transform:uppercase;
      font-size:52px;
      line-height:.94;
      font-weight:900;
      letter-spacing:-1.5px;
    }

    .hero h1 span{
      color:var(--gold);
    }

    .hero-sub{
      margin-top:11px;
      font-size:13px;
      color:#eaeaea;
      text-transform:uppercase;
      font-weight:700;
      line-height:1.35;
    }

    .hero-sub strong{
      color:var(--gold);
    }

    .benefits{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .benefit{
      display:flex;
      align-items:center;
      gap:7px;
      min-width:125px;
    }

    .benefit-icon{
      color:var(--gold);
      font-size:23px;
      width:28px;
      text-align:center;
    }

    .benefit-text{
      font-size:9px;
      line-height:1.2;
      font-weight:900;
      text-transform:uppercase;
    }

    /* =========================
       PAQUETES
    ========================= */

    .packages-section{
      padding:12px 0 26px;
      background:
        radial-gradient(circle at 50% 0%,rgba(246,195,79,.025),transparent 24%),
        #030303;
    }

    .packages{
      width:min(var(--max),calc(100% - 20px));
      margin:auto;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .package-card{
      position:relative;
      overflow:hidden;
      min-height:230px;
      border:1px solid var(--gold2);
      border-radius:13px;
      background:
        linear-gradient(145deg,#080808 0%,#0b0b0b 56%,#060606 100%);
      padding:16px 16px 14px;
      display:grid;
      grid-template-columns:1fr 124px;
      gap:8px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.01),
        0 0 10px rgba(246,195,79,.025);
    }

    /* humo verde suave */
    .package-card::before{
      content:"";
      position:absolute;
      right:-5%;
      top:8%;
      width:58%;
      height:84%;
      pointer-events:none;
      background:
        radial-gradient(ellipse at 55% 25%,rgba(0,170,86,.09),transparent 30%),
        radial-gradient(ellipse at 70% 55%,rgba(0,170,86,.07),transparent 35%),
        radial-gradient(ellipse at 45% 78%,rgba(0,170,86,.045),transparent 30%);
      filter:blur(18px);
      opacity:.72;
      transform:rotate(-8deg);
    }

    .package-card::after{
      content:"";
      position:absolute;
      right:10%;
      top:20%;
      width:40%;
      height:55%;
      pointer-events:none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,170,86,.045) 0%,
          rgba(0,170,86,.02) 35%,
          transparent 72%
        );
      filter:blur(10px);
      opacity:.8;
    }

    .package-left,
    .package-right{
      position:relative;
      z-index:2;
      min-width:0;
    }

    .package-icon{
      color:var(--gold);
      font-size:34px;
      line-height:1;
      margin-bottom:6px;
      text-shadow:0 0 8px rgba(246,195,79,.12);
    }

    .package-title{
      margin:0;
      text-transform:uppercase;
      font-size:24px;
      line-height:1;
      font-weight:900;
    }

    .package-subtitle{
      margin-top:5px;
      text-transform:uppercase;
      color:#eee;
      font-size:13px;
    }

    .features{
      list-style:none;
      margin:14px 0 0;
      padding:0;
      display:grid;
      gap:6px;
      font-size:11.5px;
      line-height:1.25;
      color:#f0f0f0;
    }

    .features li{
      display:flex;
      gap:7px;
      align-items:flex-start;
    }

    .check{
      width:15px;
      height:15px;
      min-width:15px;
      border:1px solid var(--gold);
      border-radius:50%;
      display:grid;
      place-items:center;
      color:var(--gold);
      font-size:8px;
      font-weight:900;
      margin-top:1px;
    }

    .highlight{
      color:var(--gold);
      font-weight:900;
    }

    .package-right{
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      align-items:flex-end;
    }

    .price{
      color:var(--gold);
      font-size:38px;
      line-height:1;
      font-weight:900;
      text-align:right;
      letter-spacing:-1px;
    }

    .period{
      color:var(--gold);
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      text-align:right;
      margin-top:4px;
    }

    .select-btn{
      width:100%;
      margin-top:13px;
      border:0;
      border-radius:8px;
      padding:11px 7px;
      color:#090909;
      font-size:12px;
      font-weight:900;
      background:linear-gradient(
        90deg,
        #d79c20 0%,
        #ffd45f 50%,
        #d79c20 100%
      );
      cursor:pointer;
    }

    /* =========================
       INFO INFERIOR
    ========================= */

    .trust-strip{
      width:min(var(--max),calc(100% - 20px));
      margin:20px auto 0;
      padding:17px 0;
      border-top:1px solid #2f230f;
      border-bottom:1px solid #2f230f;
      display:grid;
      grid-template-columns:1fr 1.4fr 1fr;
      gap:16px;
      align-items:center;
    }

    .trust-block{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .trust-icon{
      color:var(--gold);
      font-size:25px;
      width:30px;
      text-align:center;
    }

    .trust-copy strong{
      display:block;
      font-size:10px;
      text-transform:uppercase;
    }

    .trust-copy span{
      display:block;
      margin-top:3px;
      font-size:10px;
      color:#bfbfbf;
    }

    .payments-title{
      text-align:center;
      font-size:10px;
      text-transform:uppercase;
      margin-bottom:7px;
    }

    .payments{
      display:flex;
      justify-content:center;
      gap:7px;
      flex-wrap:wrap;
    }

    .payment-pill{
      padding:7px 9px;
      min-width:44px;
      text-align:center;
      border-radius:6px;
      background:#111;
      border:1px solid #242424;
      font-size:10px;
      font-weight:900;
    }

    .wa-btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:6px;
      padding:9px 13px;
      border:1px solid var(--gold2);
      border-radius:13px;
      font-size:11px;
      font-weight:800;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer{
      width:min(var(--max),calc(100% - 20px));
      margin:auto;
      padding:20px 0 28px;
      display:grid;
      grid-template-columns:1fr 1.2fr 1fr;
      gap:18px;
      align-items:center;
    }

    .footer-brand strong{
      display:block;
      color:var(--gold);
      font-family:Georgia,serif;
      font-size:21px;
    }

    .footer-brand span{
      display:block;
      color:#d5b35c;
      font-size:9px;
      letter-spacing:2px;
      margin-top:3px;
    }

    .motto{
      text-align:center;
      color:#e6e6e6;
      font-size:11px;
      line-height:1.45;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    .motto strong{
      color:var(--gold);
    }

    .social{
      display:flex;
      justify-content:flex-end;
      gap:12px;
      font-size:21px;
    }

    /* =========================
       IPHONE / MOBILE
    ========================= */

    @media(max-width:700px){

      .topbar-inner{
        height:64px;
        gap:18px;
        padding:0 11px;
      }

      .brand-icon{
        font-size:23px;
      }

      .brand-text strong{
        font-size:18px;
      }

      .brand-text span{
        font-size:6px;
        letter-spacing:1.8px;
      }

      .nav{
        gap:18px;
      }

      .nav a{
        padding:24px 0 20px;
        font-size:11px;
      }

      .logout{
        padding:9px 11px;
        font-size:11px;
        border-radius:13px;
      }

      .hero{
        min-height:355px;
      }

      .hero-inner{
        width:calc(100% - 18px);
        min-height:355px;
        padding:20px 0;
      }

      .hero-copy{
        width:54%;
      }

      .hero-bg{
        background:
          linear-gradient(

          ),

      }

      .hero-logo-text strong{

      }

      .hero h1{

      .hero-sub{

      .check{

      }

      .price{
        font-size:27px;
      }

      .period{
        font-size:8px;
      }

      .select-btn{
        font-size:9px;

      }
